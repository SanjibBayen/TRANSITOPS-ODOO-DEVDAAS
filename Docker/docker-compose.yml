version: '3.8'

services:
  backend:
    build:
      context: ../services/server
      dockerfile: ../../docker/backend/Dockerfile
    container_name: transitops-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
    env_file:
      - ../services/server/.env
    volumes:
      - ../services/server/src:/app/src
    networks:
      - transitops-network
    restart: unless-stopped

  frontend:
    build:
      context: ../services/client
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: transitops-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_WS_URL=ws://localhost:5000
    volumes:
      - ../services/client/src:/app/src
    depends_on:
      - backend
    networks:
      - transitops-network
    restart: unless-stopped

networks:
  transitops-network:
    driver: bridge
